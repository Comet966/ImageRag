<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' imagerag:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>拾图 · Image RAG</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="library.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">▧</span><strong>拾图</strong><span class="brand-sub">Image RAG</span></div>
    <div class="library-tools"><span id="connection" class="connection">正在连接图库</span><button id="index-button" class="button secondary" disabled>建立索引</button></div>
  </header>
  <main>
    <section class="search-section" aria-labelledby="headline">
      <div class="eyebrow">你的图片，用你的话来找</div>
      <h1 id="headline">描述一下，你想找的那张图。</h1>
      <form id="search-form" class="search-box">
        <svg class="search-symbol" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="query" name="query" aria-label="用自然语言描述图片" placeholder="例如：一只猫，或者一杯放在桌上的咖啡" maxlength="1000" autocomplete="off">
        <button id="search-button" type="submit" class="button primary" disabled><span class="search-label">搜索图片</span><svg class="button-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <div class="suggestions"><span>试着搜</span><button data-query="一只猫">一只猫</button><button data-query="一架飞机">一架飞机</button><button data-query="手机上的应用界面截图">手机截图</button><button data-query="桌上的笔记本电脑">笔记本电脑</button><button data-query="卡通漫画">卡通漫画</button></div>
    </section>
    <section id="notice" class="notice" role="status" hidden></section>
    <section id="index-progress" class="index-progress" aria-label="图片索引进度" hidden><progress id="progress-bar" max="100" value="0"></progress><span id="progress-label">准备入库</span></section>
    <section class="gallery-section" aria-labelledby="gallery-title">
      <div class="gallery-header"><div><h2 id="gallery-title">全部图片</h2><p id="gallery-info">正在读取本地图库…</p></div><button id="reset-button" class="button secondary" hidden>查看全部</button></div>
      <div class="media-filters" aria-label="按图片类型浏览"><button data-media-type="all" aria-pressed="true">全部</button><button data-media-type="photo" aria-pressed="false">生活照片</button><button data-media-type="screenshot" aria-pressed="false">屏幕截图</button><button data-media-type="illustration" aria-pressed="false">卡通 / 插画</button></div>
      <div id="gallery" class="gallery" aria-busy="true"></div>
      <div id="empty-state" class="empty-state" hidden><p>图库里还没有图片</p><span>在项目终端运行 npm run download:demo，随后刷新图库。</span><button id="refresh-button" class="button secondary">刷新图库</button></div>
    </section>
  </main>
  <footer><span id="footer-info">本地图片库</span><span>语义相似度用于排序，不代表匹配概率</span></footer>
  <dialog id="photo-dialog" aria-labelledby="photo-title">
    <button id="close-dialog" class="close-button" aria-label="关闭图片详情">×</button>
    <img id="detail-image" alt="">
    <div class="detail-info"><div><h2 id="photo-title"></h2><p id="photo-meta"></p><p id="photo-credit"></p></div><button id="source-button" class="button secondary">查看来源 ↗</button></div>
  </dialog>
</body>
</html>
